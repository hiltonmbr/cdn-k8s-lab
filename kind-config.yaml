# ╔══════════════════════════════════════════════════════════════════╗
# ║  kind-config.yaml — Multi-node cluster for the K8s Lab         ║
# ║                                                                 ║
# ║  Creates 1 Control Plane node + 2 Worker nodes, simulating     ║
# ║  a real cluster with separation of responsibilities.            ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Usage:
#   kind create cluster --name k8s-lab --config kind-config.yaml
#
# To delete:
#   kind delete cluster --name k8s-lab

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# ── Nós do Cluster ──
nodes:

  # Control Plane — cluster brain (API Server, Scheduler, etcd)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Port mapping to access services via localhost
    extraPortMappings:
      # Default NodePort range → localhost:30000-30100
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
      # HTTP and HTTPS for Ingress (advanced Labs)
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  # Worker 1 — runs the workloads (Pods)
  - role: worker

  # Worker 2 — second worker node to observe Pod distribution
  - role: worker
