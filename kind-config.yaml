# ╔══════════════════════════════════════════════════════════════════╗
# ║  kind-config.yaml — Cluster multi-node para o K8s Lab          ║
# ║                                                                 ║
# ║  Cria 1 nó Control Plane + 2 nós Worker, simulando um cluster  ║
# ║  real com separação de responsabilidades.                       ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Uso:
#   kind create cluster --name k8s-lab --config kind-config.yaml
#
# Para deletar:
#   kind delete cluster --name k8s-lab

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# ── Nós do Cluster ──
nodes:

  # Control Plane — cérebro do cluster (API Server, Scheduler, etcd)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Mapeamento de portas para acessar serviços via localhost
    extraPortMappings:
      # NodePort padrão → localhost:30000-30100
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
      # HTTP e HTTPS para Ingress (Labs avançados)
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  # Worker 1 — executa as cargas de trabalho (Pods)
  - role: worker

  # Worker 2 — segundo nó de trabalho para ver distribuição de Pods
  - role: worker
