# RBAC — permissions for Spark to create/manage Executor Pods
#
# When Spark runs in "client" or "cluster" mode on K8s,
# the Driver needs permission to create and monitor Executor
# Pods in the spark namespace.

# Dedicated ServiceAccount for Spark
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark
---
# Role with required permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: spark
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
# Binding: associates the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: spark
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
