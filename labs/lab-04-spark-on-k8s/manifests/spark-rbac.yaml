# RBAC — permissões para o Spark criar/gerenciar Pods de Executor
#
# Quando o Spark roda no modo "client" ou "cluster" no K8s,
# o Driver precisa de permissão para criar e monitorar os Pods
# dos Executors no namespace spark.

# ServiceAccount dedicada para o Spark
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark
---
# Role com permissões necessárias
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: spark
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
# Binding: associa a Role ao ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: spark
subjects:
- kind: ServiceAccount
  name: spark
  namespace: spark
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
