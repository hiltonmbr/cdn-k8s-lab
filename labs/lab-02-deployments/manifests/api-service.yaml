# Sales API Service
# NodePort type: accessible at http://localhost:30001
apiVersion: v1
kind: Service
metadata:
  name: api-vendas
  labels:
    app: api-vendas
spec:
  type: NodePort                   # Accessible outside the cluster
  selector:
    app: api-vendas                # Routes to Pods with label app=api-vendas
  ports:
  - port: 80                      # Service port (internal)
    targetPort: 8000               # Container port
    nodePort: 30001                # Node port (accessible via localhost)
