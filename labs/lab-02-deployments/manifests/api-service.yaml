# Service para a API de Vendas
# Tipo NodePort: acessível via http://localhost:30001
apiVersion: v1
kind: Service
metadata:
  name: api-vendas
  labels:
    app: api-vendas
spec:
  type: NodePort                   # Acessível fora do cluster
  selector:
    app: api-vendas                # Roteia para Pods com label app=api-vendas
  ports:
  - port: 80                      # Porta do Service (interna)
    targetPort: 8000               # Porta do contêiner
    nodePort: 30001                # Porta no nó (acessível via localhost)
