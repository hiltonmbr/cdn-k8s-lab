# Sales API Deployment
# Keeps 3 replicas always active with rolling update
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-vendas
  labels:
    app: api-vendas
spec:
  replicas: 3                      # 3 Pods always active
  selector:
    matchLabels:
      app: api-vendas
  strategy:
    type: RollingUpdate            # Gradual update, no downtime
    rollingUpdate:
      maxSurge: 1                  # Max 1 extra Pod during update
      maxUnavailable: 0            # No Pods unavailable
  template:
    metadata:
      labels:
        app: api-vendas
    spec:
      containers:
      - name: api
        image: api-vendas:1.0      # Local image (built in the Lab)
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "1.0"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
