# ExternalName Service — points to external PostgreSQL
#
# PostgreSQL runs as a Docker container OUTSIDE the K8s cluster.
# This Service creates a DNS alias inside the cluster, allowing
# Pods to reach the database by the name "postgres" instead of
# needing to know the host IP/hostname.
#
# host.docker.internal is a special hostname that resolves to
# the host IP (your computer) from inside Docker.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fullstack
spec:
  type: ExternalName
  externalName: host.docker.internal
