# Deployment da API Escola
# Conecta ao PostgreSQL externo via Service ExternalName
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-escola
  namespace: fullstack
  labels:
    app: api-escola
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-escola
  template:
    metadata:
      labels:
        app: api-escola
    spec:
      containers:
      - name: api
        image: api-escola:1.0
        ports:
        - containerPort: 8000
        env:
        # Configuração do banco (não-sensível) — direto no YAML
        - name: DB_HOST
          value: "host.docker.internal"     # Aponta para o PostgreSQL externo
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "escola"
        # Credenciais (sensíveis) — injetadas do Secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
