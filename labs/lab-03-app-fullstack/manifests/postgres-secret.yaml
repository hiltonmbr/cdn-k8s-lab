# Secret com credenciais do PostgreSQL externo
# ⚠️ NUNCA versione Secrets reais no Git!
#     Este é apenas um exemplo educacional.
#
# Em produção, use:
#   kubectl create secret generic postgres-secret \
#     --from-literal=POSTGRES_PASSWORD=<senha-real> \
#     -n fullstack
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fullstack
type: Opaque
data:
  # echo -n "postgres" | base64
  POSTGRES_USER: cG9zdGdyZXM=
  # echo -n "senha123" | base64
  POSTGRES_PASSWORD: c2VuaGExMjM=
