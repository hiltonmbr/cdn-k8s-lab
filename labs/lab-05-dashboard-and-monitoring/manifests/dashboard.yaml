# Kubernetes Dashboard — Supporting Manifests
#
# The official Dashboard is installed via remote URL (see README).
# This file contains the necessary supporting resources:
# ServiceAccount + ClusterRoleBinding for admin access.

# ServiceAccount for Dashboard access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
# Admin permission (learning environment only!)
# ⚠️ In production, use minimal permissions (restricted RBAC)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
