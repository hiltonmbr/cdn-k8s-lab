# Dashboard Kubernetes — Manifests de apoio
#
# O Dashboard oficial é instalado via URL remota (veja o README).
# Este arquivo contém os recursos auxiliares necessários:
# ServiceAccount + ClusterRoleBinding para acesso admin.

# ServiceAccount para acesso ao Dashboard
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
  namespace: kubernetes-dashboard
---
# Permissão de administrador (apenas para ambiente de aprendizado!)
# ⚠️ Em produção, use permissões mínimas (RBAC restrito)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: admin-user
  namespace: kubernetes-dashboard
